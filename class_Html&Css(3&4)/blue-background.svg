<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4ceb"/>
      <stop offset="100%" stop-color="#5566f2"/>
    </linearGradient>
    <clipPath id="clip">

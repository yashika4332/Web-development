  <rect x="0" y="0" width="1200" height="600" fill="url(#bg)"/>

  <g clip-path="url(#clip)" stroke="#ffffff" stroke-opacity="0.08" fill="none" stroke-width="1.5">
    <circle cx="600" cy="60" r="80"/>
    <circle cx="600" cy="60" r="160"/>
    <circle cx="600" cy="60" r="240"/>
    <circle cx="600" cy="60" r="320"/>
    <circle cx="600" cy="60" r="400"/>
    <circle cx="600" cy="60" r="480"/>
